<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>子どものAI活用に関するアンケート | team AIC</title>
<style>html,body{margin:0}body{background:#eaf3fb;min-height:100vh;padding:12px 6px}</style>
</head>
<body>
<div id="sv-app">
<style>
#sv-app *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#sv-app{--ink:#1f2a37;--sec:#5b6b7b;--mut:#8a97a5;--bd:#e2e8f0;--sax:#4a90d9;--sax2:#3a7bc0;--card:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);line-height:1.7;max-width:600px;margin:0 auto;padding:14px}
#sv-app .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 6px 24px rgba(30,60,90,.06)}
#sv-app .intro{padding:22px}
#sv-app .badge{display:inline-block;font-size:12px;font-weight:600;color:var(--sax2);background:#e8f2fc;border:1px solid #cfe4f8;border-radius:999px;padding:4px 12px;margin-bottom:12px}
#sv-app h1{font-size:20px;font-weight:700;margin-bottom:6px}
#sv-app .time{font-size:13px;color:var(--sec);margin-bottom:12px}
#sv-app .p{font-size:14px;color:var(--sec);margin-bottom:8px}
#sv-app .goro{display:flex;align-items:center;gap:12px;margin:14px 0}
#sv-app .goro img{width:76px;height:auto;flex:0 0 auto}
#sv-app .goro .cap{font-size:11px;color:var(--mut);line-height:1.5}
#sv-app button{border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#sv-app .start{width:100%;background:var(--sax);color:#fff;padding:14px;margin-top:6px}
#sv-app .start:hover{background:var(--sax2)}
#sv-app .foot{font-size:11px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.6}
#sv-app .hide{display:none!important}
/* chat */
#sv-app .chat{display:flex;flex-direction:column;height:78vh;max-height:720px;min-height:440px}
#sv-app .pbar{height:6px;background:#e6eef6}
#sv-app .pbar i{display:block;height:100%;width:0;background:var(--sax);transition:width .35s ease}
#sv-app .chead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
#sv-app .chead img{width:34px;height:34px;border-radius:50%;background:#eef6fe;object-fit:contain}
#sv-app .chead .nm{font-weight:700;font-size:14px}
#sv-app .chead .st{font-size:11px;color:var(--mut)}
#sv-app .chead .pg{margin-left:auto;font-size:12px;color:var(--sax2);font-weight:600}
#sv-app .thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#f7fbff}
#sv-app .row{display:flex;gap:9px;max-width:100%;align-items:flex-end}
#sv-app .row.user{justify-content:flex-end}
#sv-app .av{width:32px;height:32px;border-radius:50%;background:#eef6fe;object-fit:contain;flex:0 0 auto;align-self:flex-start}
#sv-app .bub{font-size:14.5px;padding:10px 14px;border-radius:16px;max-width:80%;white-space:pre-wrap;word-break:break-word}
#sv-app .bub.bot{background:#fff;border:1px solid #e0ecf8;border-bottom-left-radius:5px;box-shadow:0 1px 3px rgba(30,60,90,.05)}
#sv-app .bub.user{background:var(--sax);color:#fff;border-bottom-right-radius:5px}
#sv-app .bub.typing{display:flex;gap:4px;align-items:center;padding:14px}
#sv-app .bub.typing span{width:7px;height:7px;border-radius:50%;background:#b9c9da;animation:bl 1.2s infinite}
#sv-app .bub.typing span:nth-child(2){animation-delay:.2s}#sv-app .bub.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
#sv-app .ctrl{border-top:1px solid var(--bd);padding:12px 14px;background:#fff;border-radius:0 0 18px 18px}
#sv-app .chips{display:flex;flex-wrap:wrap;gap:8px}
#sv-app .cnt{font-size:12.5px;color:var(--sax2);font-weight:600;margin-bottom:9px}
#sv-app .chip{border:1.5px solid #cfe0f0;background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:600}
#sv-app .chip:hover{border-color:var(--sax);background:#f0f7fe}
#sv-app .chip.on{border-color:var(--sax);background:var(--sax);color:#fff}
#sv-app .otherbox{margin-top:8px;width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit}
#sv-app textarea{width:100%;min-height:88px;border:1.5px solid var(--bd);border-radius:12px;padding:11px;font-size:15px;font-family:inherit;resize:vertical;outline:none}
#sv-app textarea:focus,#sv-app .otherbox:focus{border-color:var(--sax)}
#sv-app .go{margin-top:10px;display:flex;gap:8px}
#sv-app .go .send{flex:1;background:var(--sax);color:#fff;padding:11px}
#sv-app .go .send:hover{background:var(--sax2)}
#sv-app .go .skip{background:#eef2f6;color:var(--sec);padding:11px 14px}

@media (max-width:480px){#sv-app{padding:8px}#sv-app .intro{padding:18px}#sv-app h1{font-size:18px}#sv-app .chat{height:82vh;min-height:0}#sv-app .bub{font-size:14px;max-width:85%}#sv-app .chip{font-size:13px;padding:9px 12px}#sv-app .thread{padding:12px}#sv-app .ctrl{padding:10px 12px}#sv-app .goro img{width:64px}}
</style>

<div id="scr-intro" class="card intro">
  <span class="badge">✨ このアンケートも AIで作ったアンケートアプリです</span>
  <h1>子どものAI活用に関するアンケート</h1>
  <div class="time">所要時間：約3分</div>
  <p class="p">子どものAI活用について、皆さまの考えをお聞きするアンケートです。お子さまの有無にかかわらず、どなたでもご回答いただけます。</p>
  <p class="p">これからの子どもたちとAIとの関わりについて、率直なご意見をお聞かせください。</p>
  <div class="goro">
    <img id="gi" alt="ゴロニャン">
    <div class="cap">AIで作成したキャラクター<br>｜でんきねこ｜ゴロニャン<br><span style="color:var(--sax2);font-weight:600">「ぼくが順番に きいていくね！」</span></div>
  </div>
  <button class="start" id="startBtn">ゴロニャンと はじめる（約3分）</button>
  <div class="foot">ログイン不要・無料。アンケート本編は匿名でOK。最後に、活動情報を希望する方だけ、任意でニックネームや連絡先をうかがいます。</div>
</div>

<div id="scr-chat" class="card chat hide">
  <div class="chead">
    <img id="ha" alt="">
    <div>
      <div class="nm">ゴロニャン</div>
      <div class="st">AIキャラクター｜でんきねこ</div>
    </div>
    <div class="pg" id="pg">1 / 10</div>
  </div>
  <div class="pbar"><i id="pbar"></i></div>
  <div class="thread" id="thread"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
</div>

 {id:"q8",type:"multi",optional:true,title:"（お子さまがいる方へ）お子さまの年齢・学年を教えてね。複数いる場合は全部えらんでOK！（任意）",opts:["0〜3歳","年少","年中","年長","小学校1〜2年生","小学校3〜4年生","小学校5〜6年生","中学生","高校生","それ以上"]},
 {id:"q9",type:"single",title:"よかったら、あなたの年代も教えて！",opts:["20歳未満","20代","30代","40代","50代","60代","70代以上","回答しない"]},
 {id:"q10",type:"text",optional:true,title:"最後に…子どもとAIの関わりについて、自由に聞かせて！（任意）\n例：こんなAIなら使わせてよい／こういう使い方は心配／学校や家庭でこう使ってほしい など",placeholder:"ご自由にご記入ください（空欄でもOK）"},
 {id:"infoOptIn",type:"single",phase:"extra",endFinish:a=>!isYes(a.infoOptIn),title:"これからも、teamAICの活動報告や、AI活用イベント・大人向けのAI講座・「子どもとAIの未来」に関するお知らせを、あなたにお届けしてもいい？　あなたと、これからの子どもたちに役立つ情報だけを選んでお送りするよ。（任意）",opts:["はい、ぜひ受け取りたい","いいえ、今回は遠慮しておく"]},
 {id:"nickname",type:"text",input:true,required:true,phase:"extra",cond:a=>isYes(a.infoOptIn),title:"うれしい！ではまず、お名前のかわりに呼べる「ニックネーム」を教えてね。（必須）",placeholder:"例：さくらママ / Ken など"},
 {id:"email",type:"text",input:true,required:true,email:true,phase:"extra",cond:a=>isYes(a.infoOptIn),title:"お知らせをお届けする「メールアドレス」を教えてね。（必須）",placeholder:"例：you@example.com"},
 {id:"partner",type:"single",phase:"extra",cond:a=>isYes(a.infoOptIn),endFinish:a=>!isYes(a.partner),pre:["最後に、ひとつだけ ご案内があるよ。","【 AIC Future Partners ― 未来をともに考える仲間たち ― 】","これは、teamAIC（AI × Children）の“パートナー”を募集する制度だよ。パートナーは、これからの未来に向けた活動を一緒に考えてくれる仲間のこと。","たとえば、横塚がつくる無料のAIアプリを実際に触って感想を聞かせてくれたり、アイデアをくれたり。横塚が一人で頭を抱えて葛藤しているとき、こっそり相談にのってくれたり。ときにはアンケートのように数多くの声を集めることで、社会を動かすこともできるんだ。","活動を強制することは一切ないよ。できるときに、できることだけでOK。"],title:"そんなふうに、ときどき力を貸してくれる「パートナー」になってもいいと思う？",opts:["はい、協力できるかも","いいえ、今回は見送る"]},
 {id:"publishName",type:"single",phase:"extra",cond:a=>isYes(a.partner),pre:["ありがとう…！ とても心強いよ。🐾","【 お名前を掲載する理由 】","活動に協力してくださる皆さまへの感謝と敬意を、きちんと目に見える形で表したい。まず、それが一番の理由だよ。","そしてもう一つ。「興味はあるけれど、自分に何ができるか分からない」「参加はハードルが高い」——そんな方にも、いろいろな関わり方があることを知ってもらい、最初の一歩を踏み出しやすくしたいんだ。","AIアプリを試して感想を伝える。アイデアを共有する。アンケートに答える。ときには相談相手になる。その一つひとつが、teamAICにとって大切な活動への参画だよ。","協力してくださる方の存在が見えることで「自分も少し関わってみよう」と思う人が増えていく。その小さな積み重ねが、社会を少しずつ動かす力になると考えているんだ。","お名前の掲載は、皆さまへの賞賛と感謝であると同時に、次に参加する方の入口をひらくためのものだよ。"],title:"ホームページに、あなたの「ニックネーム」をパートナーとして掲載してもいい？",opts:["はい、掲載してもよい","いいえ、掲載はしないでほしい"]},
 {id:"socialLink",type:"text",input:true,phase:"extra",cond:a=>isYes(a.publishName),title:"ありがとう！希望があれば、掲載時にリンクできるよ。InstagramのユーザーネームやFacebook・ホームページのURLなど、載せたいページがわかるものを教えてね。（任意）",placeholder:"例：@your_insta または https://..."}
];
const REACT=["ありがとう！","なるほど〜。","うんうん、メモしたよ φ(..)","そう考えるんだね！","ふむふむ、参考になるなぁ。","いいね、教えてくれてありがとう！"];
const ans={}; let i=0;
function isYes(v){return typeof v==="string"&&v.indexOf("はい")===0;}
function applies(q){return !q.cond||q.cond(ans);}
function nextIdx(f){let k=f+1;while(k<Q.length&&!applies(Q[k]))k++;return k;}
function mainList(){return Q.filter(q=>(q.phase||"main")==="main"&&applies(q));}
const thread=document.getElementById("thread"), ctrl=document.getElementById("ctrl");
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const scroll=()=>{thread.scrollTop=thread.scrollHeight;};
function addBot(text){const r=el("div","row bot");const a=el("img","av");a.src=CAT;const b=el("div","bub bot");b.textContent=text;r.appendChild(a);r.appendChild(b);thread.appendChild(r);scroll();}
function addUser(text){const r=el("div","row user");const b=el("div","bub user");b.textContent=text;r.appendChild(b);thread.appendChild(r);scroll();}
function typing(cb){const r=el("div","row bot");r.innerHTML='<img class="av" src="'+CAT+'"><div class="bub bot typing"><span></span><span></span><span></span></div>';thread.appendChild(r);scroll();setTimeout(()=>{r.remove();cb();},600);}
function botSay(text,cb){typing(()=>{addBot(text);if(cb)setTimeout(cb,180);});}

document.getElementById("startBtn").onclick=()=>{
 document.getElementById("scr-intro").classList.add("hide");
 document.getElementById("scr-chat").classList.remove("hide");
 botSay("こんにちは！ぼく、ゴロニャン⚡ AIで作られた でんきねこだよ。",()=>{
  botSay("これから 子どもとAIについて、10個ほど 順番に きくね。3分くらいで おわるよ！",()=>ask());
 });
};
function ask(){
 const q=Q[i];
 if((q.phase||"main")==="main"){
  const ml=mainList(); const idx=ml.indexOf(q)+1, total=ml.length, left=Math.max(total-idx,0);
  document.getElementById("pg").textContent=idx+" / "+total+"（あと"+left+"問）";
  document.getElementById("pbar").style.width=Math.round(idx/total*100)+"%";
 } else {
  document.getElementById("pg").textContent="任意のご質問（ここからは自由だよ）";
  document.getElementById("pbar").style.width="100%";
 }
 const pre=q.pre||[]; let k=0;
 (function chain(){ if(k<pre.length){ botSay(pre[k++],chain); } else { botSay(q.title,()=>controls(q)); } })();
}
function controls(q){
 ctrl.innerHTML="";
 if(q.type==="single"){
  const w=el("div","chips");
  q.opts.forEach(o=>{const c=el("button","chip");c.textContent=o;c.onclick=()=>{addUser(o);ans[q.id]=o;next();};w.appendChild(c);});
  ctrl.appendChild(w);
 } else if(q.type==="multi"){
  const sel=new Set(); let otherInput=null;
  const cnt=el("div","cnt"); cnt.textContent="\u3053\u306e\u8a2a\u554f\u306f\u8907\u6570\u3048\u3089\u3079\u307e\u3059\uff08\u9078\u629e\u4e2d\uff1a0\u500b\uff09"; ctrl.appendChild(cnt);
  const w=el("div","chips"); ctrl.appendChild(w);
  const go=el("div","go");
  function upd(){cnt.textContent="\u8907\u6570\u3048\u3089\u3079\u307e\u3059\uff08\u9078\u629e\u4e2d\uff1a"+sel.size+"\u500b\uff09";}
  q.opts.forEach(o=>{const c=el("button","chip");c.textContent=o;c.onclick=()=>{
    if(sel.has(o)){sel.delete(o);c.classList.remove("on");}else{sel.add(o);c.classList.add("on");}
    if(o==="\u305d\u306e\u4ed6"){ if(sel.has(o)&&!otherInput){otherInput=el("input","otherbox");otherInput.placeholder="\u305d\u306e\u4ed6\uff08\u81ea\u7531\u8a18\u8ff0\uff09";ctrl.insertBefore(otherInput,go);} else if(!sel.has(o)&&otherInput){otherInput.remove();otherInput=null;} }
    upd();
  };w.appendChild(c);});
  const send=el("button","send");send.textContent="\u3053\u308c\u3067\u6c7a\u5b9a\u3057\u3066\u6b21\u3078";
  send.onclick=()=>{ const arr=Array.from(sel); const otherVal=otherInput?otherInput.value.trim():"";
    if(arr.length===0&&!q.optional){cnt.textContent="\u26a0 \u3072\u3068\u3064\u4ee5\u4e0a \u3048\u3089\u3093\u3067\u306d\uff08\u8907\u6570OK\uff09";cnt.style.color="#c0392b";return;}
    ans[q.id]=arr; if(otherVal)ans[q.id+"_other"]=otherVal;
    let disp=arr.length?arr.join("\u3001"):"\uff08\u9078\u629e\u306a\u3057\uff09"; if(otherVal)disp=disp.replace("\u305d\u306e\u4ed6","\u305d\u306e\u4ed6\uff1a"+otherVal);
    addUser(disp); next();
  };
  go.appendChild(send);
  if(q.optional){const sk=el("button","skip");sk.textContent="\u30b9\u30ad\u30c3\u30d7";sk.onclick=()=>{ans[q.id]=[];addUser("\uff08\u30b9\u30ad\u30c3\u30d7\uff09");next();};go.appendChild(sk);}
  ctrl.appendChild(go);
 } else {
  const ta=el(q.input?"input":"textarea"); if(q.input)ta.className="otherbox"; ta.placeholder=q.placeholder||"";
  if(q.email)ta.type="email";
  ctrl.appendChild(ta);
  const err=el("div","cnt"); err.style.color="#c0392b"; err.style.display="none"; ctrl.appendChild(err);
  const go=el("div","go");
  const send=el("button","send");send.textContent="送信する";
  send.onclick=()=>{const v=ta.value.trim();
   if(q.required&&!v){err.textContent="\u26a0 ここは必須だよ。入力してね。";err.style.display="";return;}
   if(q.email&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){err.textContent="\u26a0 メールアドレスの形式を確認してね。";err.style.display="";return;}
   ans[q.id]=v;addUser(v||"（記入なし）");next();};
  go.appendChild(send);
  if(!q.required){const sk=el("button","skip");sk.textContent="スキップ";sk.onclick=()=>{ans[q.id]="";addUser("（スキップ）");next();};go.appendChild(sk);}
  ctrl.appendChild(go);
 }
}
function next(){
 ctrl.innerHTML="";
 const q=Q[i];
 if(q.endFinish&&q.endFinish(ans)){ finish(); return; }
 const ni=nextIdx(i);
 if(ni<Q.length){
  const wasMain=(q.phase||"main")==="main", willExtra=(Q[ni].phase||"main")==="extra";
  i=ni;
  if(wasMain&&willExtra){ botSay("ここまで ほんとうに ありがとう！🐾 ここからは ぜんぶ 任意だよ。よかったら もう少しだけ 教えてね。",()=>ask()); }
  else { botSay(REACT[Math.floor(Math.random()*REACT.length)],()=>ask()); }
 } else { finish(); }
}
function finish(){
 botSay("ぜんぶ おしえてくれて ありがとう！🐾",()=>{
  botSay("あなたの声が、これからの子どもとAIの関わりを考えるヒントになるよ。ほんとうに ありがとう！",()=>submit());
 });
}
function flat(id){let v=ans[id];if(Array.isArray(v))v=v.join(" / ");v=v||"";const o=ans[id+"_other"];if(o&&v.indexOf("その他")>=0)v=v.replace("その他","その他："+o);return v;}
function submit(){
 const body=new URLSearchParams(); Q.forEach(q=>body.append(q.id,flat(q.id)));
 if(!GAS_URL||GAS_URL.indexOf("★")>=0){console.log("回答(GAS未設定):",Object.fromEntries(body));return;}
 fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body}).catch(()=>{});
}
})();
</script>
